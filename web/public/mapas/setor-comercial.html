<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setor comercial: aquisição de cliente novo</title>
  <style>
    :root {
      --bg: #0e1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --edge: #8b949e;
      --edge-emphasis: #7ee787;
      --badge-bg: #21262d;
      --header-bg: rgba(22, 27, 34, 0.9);
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      --amber: #f59e0b;
      --verde: #7ee787;
      --azul: #58a6ff;
    }
    [data-theme="light"] {
      --bg: #f6f8fa;
      --card-bg: #ffffff;
      --card-border: #d0d7de;
      --text: #1f2328;
      --text-muted: #656d76;
      --edge: #656d76;
      --edge-emphasis: #1a7f37;
      --badge-bg: #eaeef2;
      --header-bg: rgba(255, 255, 255, 0.9);
      --amber: #d97706;
      --verde: #1a7f37;
      --azul: #0969da;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    header {
      padding: 8px 14px;
      background: var(--header-bg);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 10;
    }
    .title-group h1 {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge-sub {
      font-size: 9.5px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--badge-bg);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 10.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    button:hover {
      border-color: var(--text-muted);
      background: var(--badge-bg);
    }
    button.active {
      border-color: var(--amber);
      color: var(--amber);
      background: rgba(245, 158, 11, 0.1);
    }
    #viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      position: relative;
    }
    #viewport:active { cursor: grabbing; }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .phase-rect {
      fill: var(--card-bg);
      fill-opacity: 0.12;
      stroke-width: 1.2px;
    }
    .phase-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .phase-badge {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .card-bg {
      fill: var(--card-bg);
      stroke-width: 1.5px;
      transition: stroke 0.2s, filter 0.2s;
    }
    .node-title {
      font-size: 12px;
      font-weight: 700;
      fill: var(--text);
    }
    .node-sub {
      font-size: 9.5px;
      fill: var(--text-muted);
    }
    .node-badge {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .edge-path {
      fill: none;
      stroke-linecap: round;
      transition: stroke 0.2s;
    }
    .edge-path.security {
      stroke-dasharray: 4 2;
    }
    .edge-path.dashed {
      stroke-dasharray: 3 3;
    }
    .edge-label-bg {
      fill: var(--card-bg);
      stroke: var(--card-border);
      stroke-width: 1px;
    }
    .edge-label-text {
      font-size: 9px;
      fill: var(--text-muted);
      font-weight: 500;
    }
    .node-group {
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    .node-group:hover .card-bg {
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
      stroke-width: 2px;
    }
    .node-security .card-bg {
      stroke-width: 2px;
    }
    .dimmed { opacity: 0.22; }
    .highlighted .card-bg {
      stroke-width: 2.5px !important;
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.5));
    }
  </style>
</head>

  <script>
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let startX, startY;
    const scene = document.getElementById('scene-layer');
    const viewport = document.getElementById('viewport');

    function updateTransform() {
      scene.setAttribute('transform', `translate(${panX}, ${panY}) scale(${scale})`);
    }

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const newScale = Math.min(Math.max(0.3, scale * zoomFactor), 4.0);
      scale = newScale;
      updateTransform();
    }, { passive: false });

    viewport.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    function zoomIn() {
      scale = Math.min(4.0, scale * 1.2);
      updateTransform();
    }

    function zoomOut() {
      scale = Math.max(0.3, scale / 1.2);
      updateTransform();
    }

    function resetView() {
      scale = 1;
      panX = 0;
      panY = 0;
      updateTransform();
    }

    function setView(view) {
      document.getElementById('btn-view-all').classList.toggle('active', view === 'all');
      document.getElementById('btn-view-gates').classList.toggle('active', view === 'gates');
      const nodes = document.querySelectorAll('.node-group');
      const edges = document.querySelectorAll('.edge-group');
      const phases = document.querySelectorAll('.phase-group');

      if (view === 'gates') {
        nodes.forEach(n => {
          const nid = n.getAttribute('data-node-id');
          if (nid === 'gastao_plano' || nid === 'gastao_textos') {
            n.classList.remove('dimmed');
            n.classList.add('highlighted');
          } else {
            n.classList.add('dimmed');
            n.classList.remove('highlighted');
          }
        });
        edges.forEach(e => e.classList.add('dimmed'));
        phases.forEach(p => p.classList.add('dimmed'));
      } else {
        nodes.forEach(n => {
          n.classList.remove('dimmed');
          n.classList.remove('highlighted');
        });
        edges.forEach(e => e.classList.remove('dimmed'));
        phases.forEach(p => p.classList.remove('dimmed'));
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      try { localStorage.setItem('archify-theme', next); } catch (_) {}
    }

    (function() {
      try {
        const saved = localStorage.getItem('archify-theme');
        if (saved) document.documentElement.setAttribute('data-theme', saved);
      } catch (_) {}
    })();
  </script>

  <script>
    window.addEventListener('wheel', function(e) {
      if (!e.ctrlKey && !e.metaKey) {}
    }, { passive: true });
  </script>
</body>
</html>
