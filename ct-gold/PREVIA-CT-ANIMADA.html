}}, cache={};
function normal(p){const a=[];for(const s of p.split('/'))if(s==='..')a.pop();else if(s&&s!=='.')a.push(s);return '/'+a.join('/')}
function load(id,parent='/ui/main'){
 if(id==='react')return window.React;
 if(id.endsWith('.css'))return {};
 let key=id.startsWith('.')?normal(parent.slice(0,parent.lastIndexOf('/'))+'/'+id):normal(id);key=key.replace(/\.tsx?$/,'');
 if(cache[key])return cache[key].exports;
 if(!mods[key])throw new Error('Módulo ausente '+key);
 const m=cache[key]={exports:{}};mods[key](child=>load(child,key),m,m.exports);return m.exports;
}
window.__modules=load;

function fixture(n){const catalogo=[],agentes=[];for(let i=0;i<n;i++){
 const id=i<3?['renato','luana','bia'][i]:'fixture-'+i;
 const squad=i<3?'coordenação':['bots','conteúdo','comercial'][Math.floor((i-3)/7)%3];
 const nome=nomes[i]||'Execução '+(i+1);
 if(i<24)catalogo.push({id,nome,squad,cor:i<3?'#e0c665':['#8fcfbb','#c6a7e7','#dfa47a'][Math.floor((i-3)/7)%3],papel:i<3?'Coordenação':'Operação',área:'Painel',descricao:'Agente de demonstração',aliases:[]});
 agentes.push({id:'sessao-'+id,nome,identidade:i<24?id:null,dono:i%3===0?'renato':i%3===1?'luana':'bia',tipo:i>=24?'subagente':'operacao',estado:i%7===6?'parado':i%5===4?'silencioso':'trabalhando',tarefa:tarefaTitulos[i%8],fase:'fixture',etapa:tarefaTitulos[i%8],ferramenta:i%3===0?'read':i%3===1?'edit':'search',modelo:i%2?'Modelo de teste B':'Modelo de teste A',esforco:'médio'});
}return {catalogo,agentes}}

 const [data,setData]=React.useState(()=>fixture(24)), [selected,setSelected]=React.useState(null),[only,setOnly]=React.useState(false),[theme,setTheme]=React.useState(0);
